<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OWL Dashboard</title>
  <link rel="icon" type="image/png" href="../logo1.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0b0b0b;
      --bg-panel: linear-gradient(145deg, #1d1d1d, #111111);
      --text-primary: #ffffff;
      --text-secondary: #ffffff;
      --accent: linear-gradient(90deg, #bfa758, #d4c87c);
      --accent-color: #8a7f5a;
    }

    * {
      box-sizing: border-box;
    }

    .container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 20px;
}
    
    body {
      margin: 0;
      justify-content: center;
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 1000px;
      height: 64px;
      background: var(--bg-panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
      padding: 0 20px;
      border-radius: 20px;
      margin-top: 20px;
      margin-bottom: 20px;
      box-shadow: 
    0 4px 10px rgba(0, 0, 0, 0.6), /* тінь внизу */
    inset 0 1px 0 rgba(255, 255, 255, 0.05), /* світла внутрішня лінія зверху */
    inset 0 -1px 0 rgba(0, 0, 0, 0.4); /* затемнення внизу */
  background: linear-gradient(145deg, #1b1b1b, #101010); /* оновлена панель */
  border: 1px solid rgba(255, 255, 255, 0.05); /* ледь помітний контур */
}

    .wrapper {
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 16px;
}

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo img {
      width: 50px;
      height: 50px;
    }

   .nav-buttons {
  display: flex;
  align-items: center; 
  gap: 8px;
  height: 100%;      
}

    .button {
  padding: 8px 10px;
  background: transparent;
  border: none;
  color: var(--text-primary);
  text-decoration: none;
  font-weight: 500;
  font-size: 18px;
  cursor: pointer;
  transition: color 0.3s ease;
  height: 40px;
  display: flex;
  align-items: center;
}

    .button:hover {
      color: var(--accent-color);
    }

    .connect-wallet, #connect-twitter-btn {
      max-width: 150px;          
      text-align: center;
      margin: 10px 0;
      padding: 6px 14px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 15px;
      background: var(--accent);
      color: black;
      cursor: pointer;
      transition: filter 0.3s ease;
      
    }

    .connect-wallet:hover, #connect-twitter-btn:hover {
      filter: brightness(1.15);
    }

   .main {
  display: grid;
  grid-template-columns: 280px 1fr 280px;
  justify-content: center; /* центрує сітку */
  gap: 20px 24px;           /* за потреби скоригувати відступи */
}

    .user-panel, .leaderboard-panel, .panel {
      background: var(--bg-panel);
      padding: 10px;
      border-radius: 16px;
      min-height: 220px;
      margin-top: 0px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      justify-content: start;
      gap: 0; /* ← ДОДАЙ ЦЕ */
     box-shadow: 
    0 4px 10px rgba(0, 0, 0, 0.6), /* тінь внизу */
    inset 0 1px 0 rgba(255, 255, 255, 0.05), /* світла внутрішня лінія зверху */
    inset 0 -1px 0 rgba(0, 0, 0, 0.4); /* затемнення внизу */
  background: linear-gradient(145deg, #1b1b1b, #101010); /* оновлена панель */
  border: 1px solid rgba(255, 255, 255, 0.05); /* ледь помітний контур */
}

    .panel h2 {
      color: var(--accent-color);
      margin-top: 0px;
      margin-bottom: 8px;
    }

    .leaderboard-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.leaderboard-list li {
  padding: 10px 0;
  font-size: 16px;
  border-bottom: 2px solid rgba(255, 255, 255, 0.08); 
}

.leaderboard-list li:last-child {
  border-bottom: none;
}


  .footer {
  background: var(--bg-panel);
  border-radius: 16px;
  padding: 16px 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  flex-wrap: nowrap;
  height: 64px;
  grid-column: 2 / span 2; /* ← займає колонки 2 і 3 */
  grid-row: 3; /* ← розташування по висоті */
   box-shadow: 
    0 4px 10px rgba(0, 0, 0, 0.6), /* тінь внизу */
    inset 0 1px 0 rgba(255, 255, 255, 0.05), /* світла внутрішня лінія зверху */
    inset 0 -1px 0 rgba(0, 0, 0, 0.4); /* затемнення внизу */
  background: linear-gradient(145deg, #1b1b1b, #101010); /* оновлена панель */
  border: 1px solid rgba(255, 255, 255, 0.05); /* ледь помітний контур */
}

.footer-button {
  background: var(--accent);
  color: black;
  font-weight: 600;
  font-size: 14px;
  padding: 8px 18px;
  border-radius: 12px;
  text-decoration: none;
  transition: filter 0.3s ease;
}

    .profile-picture {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-top: 12px;
      border: 2px solid linear-gradient(90deg, #bfa758, #d4c87c);
      object-fit: cover;
    }
.profile-picture:hover {
  filter: brightness(5);
}

     #listed-nfts {
  overflow-x: auto;
  width: 100%;
}

#me-listed-grid {
  display: flex;
  gap: 16px;
  scroll-behavior: smooth;
  padding-bottom: 10px;
  height: 370px;
  align-items: flex-start;
  min-width: 100%;
  max-width: 100%;
  overflow-x: auto;  
  scrollbar-width: none;
      -ms-overflow-style: none;
    }
#me-listed-grid::-webkit-scrollbar {
 display: none;
    }
    #me-listed-grid > div {
      flex-shrink: 0;
      width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    #me-listed-grid img {
      width: 100%;
      height: auto;
      max-height: 320px;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      object-fit: cover;
      display: block;
      user-select: none;
      
    }

    #me-listed-grid p {
      margin: 12px 0 4px 0;
      font-weight: bold;
      color: var(--accent-color);
      text-align: center;
      width: 100%;
      user-select: none;
    }

    #me-listed-grid button {
      padding: 6px 14px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 15px;
      background: var(--accent);
      color: black;
      cursor: pointer;
      transition: filter 0.3s ease;
    }

    #me-listed-grid button:hover {
      filter: brightness(1.3);
    }

    #leaderboard-top5 {
  list-style: none;
  padding: 0;
  margin: 0;
}

.leaderboard-entry {
  display: grid;
  grid-template-columns: 40px 1fr 60px; /* # | address | points */
  align-items: center;
  padding: 10px 8px;
  font-size: 15px;
  border-bottom: 2px solid rgba(255, 255, 255, 0.06);
}

.leaderboard-entry:last-child {
  border-bottom: none;
}

.rank {
  color: var(--accent-color);
  font-weight: 600;
  text-align: left;
}

.addr {
  color: white;
  font-weight: 500;
  text-align: left;
}

.pts {
  color: var(--accent-color);
  font-weight: 600;
  font-family: monospace;
  text-align: right;
}

    .active-raffles {
      position: relative;
      padding-top: 40px;
    }

    .soon-badge {
  display: inline-block;
  margin-left: 10px;
  background: linear-gradient(90deg, #bfa758, #d4c87c);
  color: #3b2e00;
  max-width: 150px;      
  text-align: center;
  display: inline-block;
  margin: 10px 0; 
  font-weight: 70;
  font-size: 14px;
  padding: 4px 10px;
  border-radius: 12px;
  box-shadow: 0 0 8px rgba(191, 167, 88, 0.7);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-family: 'Inter', sans-serif;
}

  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"><img src="../logo1.png" alt="logo" /></div>
      <div class="nav-buttons">
        <a href="https://owlbtc.art/leaderboard/" class="button" target="_blank">LEADERBOARD</a>
        <a href="https://owlbtc.art/collection/" class="button" target="_blank">COLLECTION</a>
        <button class="connect-wallet" id="wallet-header">CONNECT WALLET</button>
      </div>
    </header>

    <div class="main">
  <!-- LEFT COLUMN -->
  <div class="panel" style="grid-column: 1; grid-row: 1;">
    <h2>USER PANEL</h2>
    <img id="profile-image" class="profile-picture" src="" alt="Profile Picture" style="display: none;" />
    <button class="connect-wallet" id="wallet-panel">CONNECT WALLET</button>
  </div>

  <div class="panel" style="grid-column: 1; grid-row: 2 / span 2;">
    <h2>LEADERBOARD</h2>
    <ol id="leaderboard-top10"><li>Loading...</li></ol>
  </div>

  <!-- CENTER COLUMN -->
  <div class="panel" id="listed-nfts" style="grid-column: 2; grid-row: 1 / span 2;">
    <div id="me-listed-grid"></div>
  </div>

  <!-- RIGHT COLUMN -->
  <div class="panel" style="grid-column: 3; grid-row: 1;">
    <h2>ACTIVE RAFFLES</h2>
    <span class="soon-badge">SOON</span>
  </div>

  <div class="panel" style="grid-column: 3; grid-row: 2;">
    <h2>ANNOUNCEMENTS</h2>
    <ul>
      <li>Mint Phase 2 starts July 10</li>
      <li>Magic Eden Partnership Live</li>
      <li>Claim WL now - only 30 left!</li>
    </ul>
  </div>
     
    <div class="footer" style="grid-column: 2 / span 2; grid-row: 3;">
  <a href="https://x.com/OwlOrderBTC" target="_blank" class="footer-button">TWITTER</a>
  <a href="https://magiceden.io/ordinals/marketplace/owl" target="_blank" class="footer-button">MAGIC EDEN</a>
  <a href="https://yourdomain.com/collab-request" target="_blank" class="footer-button">COLLABS REQUEST</a>
</div>

</div>

  <script>
    const SNAPSHOT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdLAOdM_GrsuOclMYL9ltUVyzC_Y7Z_9Jf7ITs-tYuqj1ekgrsH76KGu14CyZ0li7vnROOSpn6FpnG/pub?output=csv&gid=0";
    const imageBaseURL = "https://raw.githubusercontent.com/oxmikem-site/owlorder-site/main/images/";
    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSdLAOdM_GrsuOclMYL9ltUVyzC_Y7Z_9Jf7ITs-tYuqj1ekgrsH76KGu14CyZ0li7vnROOSpn6FpnG/pub?gid=1127131432&single=true&output=csv';

    const walletButtons = [
      document.getElementById('wallet-header'),
      document.getElementById('wallet-panel')
    ];

    async function fetchProfileImage(wallet) {
  const img = document.getElementById("profile-image"); 

  const res = await fetch(SNAPSHOT_CSV_URL);
  const csv = await res.text();
  const rows = csv.split("\n").slice(1); 

  let match = null;

  for (const row of rows) {
    const cols = row.split(",");
    const address = cols[1]?.trim();   
    const nftNumber = cols[9]?.trim();  

    if (address === wallet && nftNumber) {
      match = nftNumber;
      break;
    }
  }

  if (!match) {
    console.warn("Wallet not found or NFT number missing:", wallet);
    img.src = "../logo1.png"; // fallback
    img.style.display = "block";
    return;
  }

  const imageURL = `${imageBaseURL}${match}.webp`;
  img.src = imageURL;
  img.onerror = () => {
    console.warn("Image failed to load, falling back.");
    img.src = "../logo1.png";
  };
  img.style.display = "block";
}


    async function connectUniSatWallet() {
      if (!window.unisat) return alert("UniSat Wallet not found.");
      try {
        await window.unisat.requestAccounts();
        const address = (await window.unisat.getAccounts())[0];
        localStorage.setItem('taproot_wallet', address);
        await handleWalletConnected(address);
        await fetchProfileImage(address);
      } catch (err) {
        console.error("Connection error:", err);
        alert("Failed to connect wallet.");
      }
    }

    async function checkHolderInSheet(address) {
      const res = await fetch(sheetURL);
      const text = await res.text();
      const rows = text.trim().split('\n').map(r => r.split(','));
      const headers = rows[0].map(h => h.trim());
      const addrIndex = headers.indexOf("Holder Address");
      const pointsIndex = headers.indexOf("Total Points");
      const row = rows.find(r => r[addrIndex]?.trim() === address.trim());
      if (row) return { found: true, address, points: row[pointsIndex] };
      return { found: false };
    }

    async function handleWalletConnected(address) {
  const result = await checkHolderInSheet(address);

  const userPanel = document.querySelector(".panel h2")?.textContent === "USER PANEL"
    ? document.querySelector(".panel")
    : document.querySelectorAll(".panel")[0];

  const img = document.getElementById("profile-image"); // ← ПЕРЕНЕСЕНО СЮДИ

  walletButtons.forEach(btn => {
  if (btn) {
    btn.textContent = `${address.slice(0, 6)}...${address.slice(-4)}`;
    btn.disabled = true;
    btn.style.opacity = '0.85';
    btn.style.marginTop = '8px'; // ← ДОДАЙ ЦЕ
  }
});

  const existingInfo = userPanel.querySelector(".wallet-info");
  if (existingInfo) existingInfo.remove();

  const wrapper = document.createElement("div");
  wrapper.className = "wallet-info";
  wrapper.style.cssText = "margin-top: 16px; font-size: 15px; line-height: 1.6;";

  if (result.found) {
    const twitterBtn = document.createElement("button");
    twitterBtn.textContent = "Connect Twitter";
    twitterBtn.className = "connect-wallet";
    twitterBtn.style.marginTop = "10px";
    twitterBtn.onclick = () => window.location.href = "/auth/twitter2";
    img.insertAdjacentElement('afterend', twitterBtn);
  }

  const totalPointsEl = document.createElement("div");
  totalPointsEl.style.cssText = "margin-top: 10px; font-size: 15px;";
  totalPointsEl.innerHTML = `<strong>Total Points:</strong> ${result.found ? result.points : 'Not found'}`;
  img.insertAdjacentElement('afterend', totalPointsEl);

  img.insertAdjacentElement('afterend', wrapper);
}

    walletButtons.forEach(btn => {
      if (btn) btn.addEventListener('click', connectUniSatWallet);
    });

    const saved = localStorage.getItem('taproot_wallet');
    if (saved) {
      handleWalletConnected(saved);
      fetchProfileImage(saved);
    }

    async function loadTop10() {
  const res = await fetch(sheetURL);
  const text = await res.text();
  const rows = text.trim().split('\n').map(row => row.split(','));
  const entries = rows.slice(1).map(row => {
    const [, address, , pointsRaw] = row;
    const cleanPoints = (pointsRaw || '0').replace(/,/g, '');
    return { address, points: cleanPoints };
  });

  const top10 = entries.slice(0, 10).map(({ rank, address, points }) => {
  const shortAddr = address.slice(0, 6) + '...' + address.slice(-4);
  return `
    <li class="leaderboard-entry">
      <span class="rank">#${rank}</span>
      <span class="addr">${shortAddr}</span>
      <span class="pts">${points}</span>
    </li>
  `;
}).join('');
document.getElementById('leaderboard-top5').innerHTML = top10;
}

    loadTop10();

    let listed = [];
    let currentIndex = 0;
    let direction = 1;

    async function fetchListedNFTsGrid() {
      const res = await fetch(SNAPSHOT_CSV_URL);
      const csv = await res.text();
      const rows = csv.split("\n").slice(1);
      listed = rows.map(r => r.split(",")).filter(cols => cols[3] && cols[3].toLowerCase().trim() === "yes");

      const container = document.getElementById("me-listed-grid");
      container.innerHTML = "";

      listed.forEach(cols => {
        const nftNumber = cols[9]?.trim();
        const inscriptionId = cols[0]?.trim();
        const imageURL = `${imageBaseURL}${nftNumber}.webp`;
const meURL = `https://magiceden.io/ordinals/item-details/${inscriptionId}`;

        const nftDiv = document.createElement("div");
        nftDiv.style.textAlign = "center";
        nftDiv.innerHTML = `
  <img src="${imageURL}" alt="Owl #${nftNumber}" />
  <p>Owl #${nftNumber}</p>
  <a href="${meURL}" target="_blank">
    <button>Buy on ME</button>
  </a>
`;
        container.appendChild(nftDiv);
      });

      if (listed.length > 1) {
        setInterval(() => {
          if (currentIndex === listed.length - 1) direction = -1;
          else if (currentIndex === 0) direction = 1;

          currentIndex += direction;

          container.scrollTo({
            left: currentIndex * (300 + 16),
            behavior: 'smooth'
          });
        }, 3000);
      }
    }

    window.addEventListener("DOMContentLoaded", fetchListedNFTsGrid);
  </script>
</body>
</html>
