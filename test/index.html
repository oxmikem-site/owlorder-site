<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OWL Dashboard</title>
  <link rel="icon" type="image/png" href="../logo2.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0b0b0b;
      --bg-panel: linear-gradient(145deg, #1d1d1d, #111111);
      --text-primary: #ffffff;
      --text-secondary: #ffffff;
      --accent: linear-gradient(90deg, #bfa758, #d4c87c);
      --accent-color: #8a7f5a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      width: 100%;
      height: 64px;
      background: var(--bg-panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo img {
      width: 50px;
      height: 50px;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
    }

    .button {
      padding: 8px 10px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 18px;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .button:hover {
      color: var(--accent-color);
    }

    .connect-wallet, #connect-twitter-btn {
      padding: 6px 14px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 15px;
      background: var(--accent);
      color: black;
      cursor: pointer;
      transition: filter 0.3s ease;
    }

    .connect-wallet:hover, #connect-twitter-btn:hover {
      filter: brightness(1.15);
    }

    .main {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 300px;
      gap: 24px;
    }

    .user-panel, .leaderboard-panel, .panel {
      background: var(--bg-panel);
      padding: 10px 16px;
      border-radius: 16px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    .panel h2 {
      color: var(--accent-color);
      margin-top: 10px;
      margin-bottom: 16px;
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .profile-picture {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-top: 16px;
      border: 2px solid var(--accent-color);
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"><img src="../logo1.png" alt="logo" /></div>
      <div class="nav-buttons">
        <a href="#" class="button">LEADERBOARD</a>
        <a href="#" class="button">COLLECTION</a>
        <button class="connect-wallet" id="wallet-header">CONNECT WALLET</button>
      </div>
    </header>

    <div class="main">
      <div class="user-panel">
        <h2>USER PANEL</h2>
        <button class="connect-wallet" id="wallet-panel">CONNECT WALLET</button>
        <img id="profile-image" class="profile-picture" src="" alt="Profile Picture" style="display: none;" />
      </div>

      <div class="panel" id="listed-nfts">
        <div id="me-listed-grid"></div>
      </div>

      <div class="panel active-raffles">
        <h2>ACTIVE RAFFLES</h2>
        <ul>
          <li>Retweet & Earn 20 Points</li>
          <li>Hold Owl #100+ to enter raffle #2</li>
        </ul>
      </div>

      <div class="leaderboard-panel">
        <h2>LEADERBOARD</h2>
        <ol id="leaderboard-top3"><li>Loading...</li></ol>
      </div>

      <div class="panel">
        <h2>ANNOUNCEMENTS</h2>
        <ul>
          <li>Mint Phase 2 starts July 10</li>
          <li>Magic Eden Partnership Live</li>
          <li>Claim WL now - only 30 left!</li>
        </ul>
      </div>
    </div>

    <div class="footer">TWITTER · DISCORD · DOCS · TERMS</div>
  </div>

  <script>
    const imageBaseURL = "https://raw.githubusercontent.com/oxmikem-site/owlorder-site/main/images/";
    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSdLAOdM_GrsuOclMYL9ltUVyzC_Y7Z_9Jf7ITs-tYuqj1ekgrsH76KGu14CyZ0li7vnROOSpn6FpnG/pub?gid=1127131432&single=true&output=csv';

    async function fetchProfileImage(wallet) {
      const res = await fetch(sheetURL);
      const text = await res.text();
      const rows = text.trim().split('\n').map(r => r.split(','));
      const headers = rows[0].map(h => h.trim());
      const addrIndex = headers.indexOf("Holder Address");
      const nftIndex = headers.indexOf("Owl #");
      const owned = rows.filter(r => r[addrIndex]?.trim() === wallet);
      if (owned.length > 0) {
        const nftNumber = owned[0][nftIndex]?.trim();
        const img = document.getElementById("profile-image");
        img.src = `${imageBaseURL}${nftNumber}.webp`;
        img.style.display = "block";
      }
    }

    async function connectUniSatWallet() {
      if (!window.unisat) return alert("UniSat Wallet not found.");
      try {
        await window.unisat.requestAccounts();
        const address = (await window.unisat.getAccounts())[0];
        localStorage.setItem('taproot_wallet', address);
        await handleWalletConnected(address);
        await fetchProfileImage(address);
      } catch (err) {
        console.error("Connection error:", err);
        alert("Failed to connect wallet.");
      }
    }

    async function handleWalletConnected(address) {
      const buttons = [document.getElementById('wallet-header'), document.getElementById('wallet-panel')];
      buttons.forEach(btn => {
        btn.textContent = `${address.slice(0, 6)}...${address.slice(-4)}`;
        btn.disabled = true;
        btn.style.opacity = '0.85';
      });
    }

    const walletButtons = [
      document.getElementById('wallet-header'),
      document.getElementById('wallet-panel')
    ];
    walletButtons.forEach(btn => btn.addEventListener('click', connectUniSatWallet));

    const saved = localStorage.getItem('taproot_wallet');
    if (saved) {
      handleWalletConnected(saved);
      fetchProfileImage(saved);
    }
  </script>
</body>
</html>
