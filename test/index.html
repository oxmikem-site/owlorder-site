<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OWL Dashboard</title>
  <!-- підключення шрифту та стилів -->
</head>
<body>
  <!-- твій HTML макет -->
  <button class="connect-wallet" id="wallet-header">CONNECT WALLET</button>
  <button class="connect-wallet" id="wallet-panel">CONNECT WALLET</button>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btns = [
        document.getElementById('wallet-header'),
        document.getElementById('wallet-panel')
      ];

      // Показуємо адреси, якщо вже збережені
      const saved = localStorage.getItem('taproot_wallet');
      if (saved) {
        const short = `${saved.slice(0,6)}...${saved.slice(-4)}`;
        btns.forEach(b => {
          b.textContent = short;
          b.disabled = true;
          b.style.opacity = '0.85';
        });
      }

      async function connect() {
        if (!window.SatsConnect || typeof window.SatsConnect.request !== 'function') {
          return alert('Будь ласка, відкрийте сайт у гаманець-контейнері: Xverse, Unisat або сумісному.');
        }

        try {
          const resp = await window.SatsConnect.request('getAddresses', {
            purposes: ['ordinals','payment'],
            // Додавання getProvider — рекомендується, якщо встановлено кілька провайдерів :contentReference[oaicite:7]{index=7}
            getProvider: window.SatsConnect.getProvider?.()
          });

          const ord = resp.addresses.find(a => a.purpose === 'ordinals')?.address;
          if (!ord) {
            return alert('⚠️ Одночасно знайдено адресу, але без ordinals‑адреси');
          }

          const short = `${ord.slice(0,6)}...${ord.slice(-4)}`;
          btns.forEach(b => {
            b.textContent = short;
            b.disabled = true;
            b.style.opacity = '0.85';
          });
          localStorage.setItem('taproot_wallet', ord);

          // Відправити адресу на бекенд
          const res = await fetch('https://owl-backend-plkm.onrender.com/api/save-wallet', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({wallet: ord})
          });
          const j = await res.json();
          if (!j.success) console.warn('💥 save-wallet failed:', j.error);

        } catch (err) {
          console.error(err);
          alert('❌ Помилка підключення гаманця');
        }
      }

      btns.forEach(b => b.addEventListener('click', connect));
    });
  </script>
</body>
</html>
