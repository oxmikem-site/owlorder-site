    function parseCSV(text){
  const rows=[]; let cur='', row=[], q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if (c === '"'){ if (q && n === '"'){ cur+='"'; i++; } else { q=!q; } }
    else if (c === ',' && !q){ row.push(cur); cur=''; }
    else if ((c === '\n' || c === '\r') && !q){
      if (cur!=='' || row.length){ row.push(cur); rows.push(row); }
      cur=''; row=[]; if (c==='\r' && n==='\n') i++;
    } else { cur+=c; }
  }
  if (cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
    
function shortenAddress(addr) {
  return addr.slice(0, 6) + '...' + addr.slice(-4);
}

async function fetchProfileImage(wallet) {
  const img = document.getElementById("profile-image");
  const res = await fetch(SNAPSHOT_CSV_URL);
  const csv = await res.text();
  const rows = csv.split("\n").slice(1);

  let match = null;
  for (const row of rows) {
    const cols = row.split(",");
    const address = cols[1]?.trim();
    const nftNumber = cols[9]?.trim();
    if (address === wallet && nftNumber) {
      match = nftNumber;
      break;
    }
  }

  if (!match) {
    img.src = "../logo1.png";
    img.style.display = "block";
    return;
  }

  const imageURL = `${imageBaseURL}${match}.webp`;
  img.src = imageURL;
  img.onerror = () => (img.src = "../logo1.png");
  img.style.display = "block";
}

async function connectUniSatWallet() {
  if (!window.unisat) {
    alert("UniSat Wallet not found. Install/enable the extension.");
    return;
  }
  try {
    let address;

    // 1) спроба взяти з requestAccounts
    const req = await window.unisat.requestAccounts();
    if (Array.isArray(req) && req.length) address = req[0];

    // 2) фолбек: якщо нічого — беремо з getAccounts
    if (!address) {
      const accs = await window.unisat.getAccounts();
      if (Array.isArray(accs) && accs.length) address = accs[0];
    }

    if (!address) {
      alert("No address returned. Unlock UniSat and approve the connection.");
      return;
    }

    localStorage.setItem('taproot_wallet', address);
    updateWalletButtons(address);
    await Promise.all([handleWalletConnected(address), fetchProfileImage(address)]);
  } catch (err) {
    console.error('UniSat connect error:', err);
    alert(`Failed to connect wallet: ${err?.message || err}`);
  }
}

    if (window.unisat) {
  // коли користувач у гаманці перемикає адресу
  window.unisat.on('accountsChanged', (accounts) => {
    const addr = Array.isArray(accounts) && accounts[0] ? accounts[0] : null;
    if (addr) {
      localStorage.setItem('taproot_wallet', addr);
      updateWalletButtons(addr);
      handleWalletConnected(addr);
      fetchProfileImage(addr);
    } else {
      localStorage.removeItem('taproot_wallet');
      location.reload();
    }
  });

  // коли змінюється мережа — просто оновимо кнопки, якщо вже збережено адресу
  window.unisat.on('networkChanged', () => {
    const saved = localStorage.getItem('taproot_wallet');
    if (saved) updateWalletButtons(saved);
  });
}

    function bindWalletBtn(btnId, dropdownId){
  const btn = document.getElementById(btnId);
  const dd  = document.getElementById(dropdownId);
  if (!btn) return;

  btn.addEventListener('click', async (e)=>{
    e.stopPropagation();
    const saved = localStorage.getItem('taproot_wallet');
    if (!saved) {
      await connectUniSatWallet();  // один виклик і крапка
    } else if (dd) {
      dd.style.display = (dd.style.display === 'block' ? 'none' : 'block');
    }
  });
}


let _walletListenersBound = false;
    
function updateWalletButtons(address){
  if (!address || typeof address !== 'string') return; // ← guard

  const short = shortenAddress(address);
  document.getElementById("wallet-header-btn").textContent = short;
  document.getElementById("wallet-side-btn").textContent   = short;

  if (_walletListenersBound) return;
  _walletListenersBound = true;

  document.querySelectorAll(".logout-btn").forEach(btn=>{
    btn.addEventListener('click', ()=>{
      localStorage.removeItem("taproot_wallet");
      location.reload();
    });
  });
}

async function checkHolderInSheet(address){
  const res  = await fetch(sheetURL, { cache:'no-store' });
  const csv  = await res.text();
  const tbl  = parseCSV(csv);
  const head = tbl[0].map(h => (h||'').trim().toLowerCase());
  const ai   = head.indexOf('holder address');
  const pi   = head.indexOf('total points');
  const me   = address.trim().toLowerCase();
  const row  = tbl.slice(1).find(r => ((r[ai]||'')+'').trim().toLowerCase() === me);
  return row ? { found:true, address, points:(r=>r? r.replace(/,/g,'') : '0')(row[pi]) }
             : { found:false };
}

wrapper = document.createElement("div");

wrapper.style.cssText = "margin-top: 16px; font-size: 15px; line-height: 1.6;";

  if (result.found) {
  img.style.display = "block";

  const totalPointsEl = document.createElement("div");
  totalPointsEl.style.cssText = "margin-top: 10px; font-size: 15px;";
  totalPointsEl.innerHTML = `<strong>Total Points:</strong> ${result.points}`;
  wrapper.appendChild(totalPointsEl);

  const profileBtn = document.createElement("a");
  profileBtn.href = "https://owlbtc.art/profile/";
  profileBtn.textContent = "Profile";
  profileBtn.className = "connect-wallet";
  profileBtn.style.display = "inline-block";
  profileBtn.style.textAlign = "center";
  profileBtn.style.marginTop = "10px";
  profileBtn.style.textDecoration = "none";
  wrapper.appendChild(profileBtn);
  profileBtn.classList.add("profile-button");

}

  else {
    img.style.display = "none";
    const getOwlBtn = document.createElement("button");
    getOwlBtn.textContent = "Get your OWL";
    getOwlBtn.className = "connect-wallet";
    getOwlBtn.style.marginTop = "10px";
    getOwlBtn.onclick = () => window.open("https://owlbtc.art/collection", "_blank");
    userPanel.appendChild(getOwlBtn);
  }
}

async function loadtop5(){
  const res  = await fetch(sheetURL, { cache:'no-store' });
  const csv  = await res.text();
  const tbl  = parseCSV(csv);
  const head = tbl[0].map(h => (h||'').trim().toLowerCase());
  const ai   = head.indexOf('holder address');
  const pi   = head.indexOf('total points');
  const rows = tbl.slice(1)
                  .map(r => ({ address:(r[ai]||'').trim(),
                               points: Number((r[pi]||'0').replace(/,/g,'')) }))
                  .filter(x => x.address);
  rows.sort((a,b)=> b.points - a.points);
  const top5 = rows.slice(0,5).map(({address,points},i)=>`
    <li class="leaderboard-entry">
      <span class="rank">#${i+1}</span>
      <span class="addr">${shortenAddress(address)}</span>
      <span class="pts">${points.toLocaleString()}</span>
    </li>`).join('');
  document.getElementById('leaderboard-top5').innerHTML = top5;
}

async function fetchListedNFTsGrid() {
  const res = await fetch(SNAPSHOT_CSV_URL);
  const csv = await res.text();
  const rows = csv.split("\n").slice(1);
  const listed = rows.map(r => r.split(",")).filter(cols => cols[3]?.toLowerCase().trim() === "yes");

  const container = document.getElementById("me-listed-grid");
  container.innerHTML = "";

  listed.forEach(cols => {
    const nftNumber = cols[9]?.trim();
    const inscriptionId = cols[0]?.trim();
    const imageURL = `${imageBaseURL}${nftNumber}.webp`;
    const meURL = `https://magiceden.io/ordinals/item-details/${inscriptionId}`;

    const nftDiv = document.createElement("div");
    nftDiv.style.textAlign = "center";
    nftDiv.innerHTML = `
  <img src="${imageURL}" alt="Owl #${nftNumber}" />
  <p class="nft-number">Owl #${nftNumber}</p>
  <a href="${meURL}" target="_blank">
    <button>Buy on ME</button>
  </a>
  <hr class="nft-divider" />
  <p class="nft-description">
    Earn points by holding this NFT in your wallet. Points are updated daily based on snapshot data.
  </p>
`;
    container.appendChild(nftDiv);
  });

  let currentIndex = 0;
  let direction = 1;

  if (listed.length > 1) {
    setInterval(() => {
      if (currentIndex === listed.length - 1) direction = -1;
      else if (currentIndex === 0) direction = 1;
      currentIndex += direction;
      container.scrollTo({ left: currentIndex * (325 + 16), behavior: 'smooth' });
    }, 3000);
  }
}

function escapeHTML(s){
  return (s||'').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function loadLatestAnnouncement(){
  const snap = await db.ref("chats/announcements").limitToLast(1).once("value");
  const data = snap.val();
  if (!data) return;

  const lastMsg = Object.values(data)[0];
  let text = escapeHTML(lastMsg.text || "(no text)");
  text = text.replace(/@([a-zA-Z0-9_]+)/g, (_,u)=>
    `<a href="https://x.com/${u}" target="_blank" rel="noopener noreferrer" style="color: var(--accent-color); text-decoration: none;">@${u}</a>`
  );

  const date = new Date(lastMsg.timestamp || Date.now()).toLocaleDateString();
  const trimmed = text.length > 160 ? text.slice(0,160) + "..." : text;

  const ul = document.getElementById("announcements-list");
  if (ul) ul.innerHTML = `<li><strong>${date}</strong>: ${trimmed}</li>`;
}
