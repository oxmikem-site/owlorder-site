<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OWL Dashboard</title>
  <link rel="icon" type="image/png" href="../logo2.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0b0b0b;
      --bg-panel: linear-gradient(145deg, #1d1d1d, #111111);
      --bg-inner: linear-gradient(145deg, #1d1d1d, #111111);
      --text-primary: #ffffff;
      --text-secondary: #ffffff;
      --accent: linear-gradient(90deg, #a4976e, #8a7f5a);
      --accent-color: #8a7f5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg-dark); color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column; align-items: center;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      width: 100%; max-width: 1000px; height: 64px;
      background: linear-gradient(145deg, #151515, #0d0d0d);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; border-radius: 0 0 20px 20px;
      box-sizing: border-box;
    }
    .logo img { width: 50px; height: 50px; }
    .nav-buttons { display: flex; gap: 4px; }
    .button {
      padding: 8px 10px; background: transparent; border: none;
      color: var(--text-primary); text-decoration: none;
      font-weight: 500; font-size: 18px;
    }
    .button:hover { color: var(--accent-color); }
    .connect-wallet {
      padding: 6px 14px; border-radius: 12px; border: none;
      font-weight: 600; font-size: 15px;
      background: var(--accent); color: black; cursor: pointer;
    }
    .main {
      width: 100%; max-width: 1000px;
      padding: 40px 20px;
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      gap: 24px;
      box-sizing: border-box;
    }
    .user-panel, .leaderboard-panel {
      max-width: 1000px;
      width: 320px;
      background: var(--bg-panel);
      padding: 20px;
      border-radius: 16px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      box-sizing: border-box;
    }
    .panel {
      background: var(--bg-panel);
      padding: 20px;
      border-radius: 16px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      box-sizing: border-box;
    }
    .panel h2 {
      color: var(--accent-color);
      margin-bottom: 16px;
    }
    .footer {
      margin-top: 40px; text-align: center;
      color: var(--text-secondary); font-size: 14px;
    }
    #me-listed-grid {
      display: flex;
      overflow: hidden;
      width: 300px;
      gap: 16px;
      scroll-behavior: smooth;
      padding-bottom: 10px;
      height: 370px;
      align-items: flex-start;
    }
    #me-listed-grid > div {
  flex-shrink: 0;
  width: 300px;
  display: flex;
  flex-direction: column;
  align-items: center;      /* Центруємо горизонтально */
  justify-content: center;  /* Центруємо вертикально */
  border-radius: 16px;
  padding: 0;               /* прибираємо падінги для зникнення світлого фону */
  box-sizing: border-box;
  height: 100%;
  background: transparent;  /* прибираємо фон */
  overflow: hidden;         /* щоб радіуси працювали */
}

#me-listed-grid img {
  width: 100%;
  height: auto;
  max-height: 320px;        /* збільшене зображення */
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
  object-fit: cover;
  display: block;
  user-select: none;
}

#me-listed-grid p {
  margin: 12px 0 4px 0;
  font-weight: bold;
  color: var(--accent-color);
  text-align: center;
  width: 100%;
  user-select: none;
}

#me-listed-grid button {
  margin: 0 auto 12px auto;
  padding: 8px 16px;
  background: #8a7f5a;
  border: none;
  color: #fff;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  user-select: none;
  display: block;
}

    .active-raffles li::before {
      content: "🔥 ";
      margin-right: 6px;
      user-select: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><img src="../logo1.png" alt="logo" /></div>
    <div class="nav-buttons">
      <a href="#" class="button">LEADERBOARD</a>
      <a href="#" class="button">COLLECTION</a>
      <button class="connect-wallet" id="wallet-header">CONNECT WALLET</button>
    </div>
  </header>

  <div class="main">
    <div class="user-panel">
      <h2>USER PANEL</h2>
      <button class="connect-wallet" id="wallet-panel">CONNECT WALLET</button>
    </div>

    <div class="panel" id="listed-nfts">
      <div id="me-listed-grid"></div>
    </div>

    <div class="panel active-raffles">
      <h2>ACTIVE RAFFLES</h2>
      <ul>
        <li>Retweet & Earn 20 Points</li>
        <li>Hold Owl #100+ to enter raffle #2</li>
      </ul>
    </div>

    <div class="leaderboard-panel">
      <h2>LEADERBOARD</h2>
      <ol id="leaderboard-top3"><li>Loading...</li></ol>
    </div>

    <div class="panel">
      <h2>ANNOUNCEMENTS</h2>
      <ul>
        <li>Mint Phase 2 starts July 10</li>
        <li>Magic Eden Partnership Live</li>
        <li>Claim WL now - only 30 left!</li>
      </ul>
    </div>
  </div>

  <div class="footer">TWITTER · DISCORD · DOCS · TERMS</div>

  <script>
    const SNAPSHOT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdLAOdM_GrsuOclMYL9ltUVyzC_Y7Z_9Jf7ITs-tYuqj1ekgrsH76KGu14CyZ0li7vnROOSpn6FpnG/pub?output=csv&gid=0";
    const imageBaseURL = "https://raw.githubusercontent.com/oxmikem-site/owlorder-site/main/images/";

    const walletButtons = [
      document.getElementById('wallet-header'),
      document.getElementById('wallet-panel')
    ];

    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSdLAOdM_GrsuOclMYL9ltUVyzC_Y7Z_9Jf7ITs-tYuqj1ekgrsH76KGu14CyZ0li7vnROOSpn6FpnG/pub?gid=1127131432&single=true&output=csv';

    async function connectUniSatWallet() {
      if (!window.unisat) return alert("UniSat Wallet not found.");
      try {
        await window.unisat.requestAccounts();
        const address = (await window.unisat.getAccounts())[0];
        localStorage.setItem('taproot_wallet', address);
        handleWalletConnected(address);
        setTimeout(() => {
          window.location.href = `/profile/?address=${address}`;
        }, 1000);
      } catch (err) {
        console.error("Connection error:", err);
        alert("Failed to connect wallet.");
      }
    }

    async function checkHolderInSheet(address) {
      const res = await fetch(sheetURL);
      const text = await res.text();
      const rows = text.trim().split('\n').map(r => r.split(','));
      const headers = rows[0].map(h => h.trim());
      const addrIndex = headers.indexOf("Holder Address");
      const pointsIndex = headers.indexOf("Total Points");
      const row = rows.find(r => r[addrIndex]?.trim() === address.trim());
      if (row) return { found: true, address, points: row[pointsIndex] };
      return { found: false };
    }

    async function handleWalletConnected(address) {
      const result = await checkHolderInSheet(address);
      const userPanel = document.querySelector(".user-panel");

      walletButtons.forEach(btn => {
        btn.textContent = `${address.slice(0, 6)}...${address.slice(-4)}`;
        btn.disabled = true;
        btn.style.opacity = '0.85';
      });

      const existingInfo = userPanel.querySelector(".wallet-info");
      if (existingInfo) existingInfo.remove();

      const wrapper = document.createElement("div");
      wrapper.className = "wallet-info";
      wrapper.style.cssText = "margin-top: 16px; font-size: 15px; line-height: 1.6;";
      wrapper.innerHTML =
        `<strong>Connected:</strong> ${address.slice(0, 6)}...${address.slice(-4)}<br/>
         <strong>Total Points:</strong> ${result.found ? result.points : 'Not found'}`;

      if (result.found) {
        const twitterBtn = document.createElement("button");
        twitterBtn.textContent = "Connect Twitter";
        twitterBtn.style.cssText = "margin-top: 10px; padding: 8px 12px; background: var(--accent); color: black; border: none; border-radius: 10px; cursor: pointer; font-weight: 600;";
        twitterBtn.onclick = () => window.location.href = "/auth/twitter2";
        wrapper.appendChild(twitterBtn);
      }

      userPanel.appendChild(wrapper);
    }

    walletButtons.forEach(btn => btn.addEventListener('click', connectUniSatWallet));
    const saved = localStorage.getItem('taproot_wallet');
    if (saved) handleWalletConnected(saved);

    async function loadTop3() {
      const res = await fetch(sheetURL);
      const text = await res.text();
      const rows = text.trim().split('\n').map(r => r.split(','));
      const headers = rows[0];
      const addrIndex = headers.indexOf("Holder Address");
      const pointsIndex = headers.indexOf("Total Points");
      const top3 = rows.slice(1)
        .sort((a, b) => +b[pointsIndex] - +a[pointsIndex])
        .slice(0, 3)
        .map(r => `<li>${r[addrIndex].slice(0, 6)}...${r[addrIndex].slice(-4)} - ${r[pointsIndex]}</li>`)
        .join('');
      document.getElementById('leaderboard-top3').innerHTML = top3;
    }

    loadTop3();

    let listed = [];
    let currentIndex = 0;

    async function fetchListedNFTsGrid() {
      const res = await fetch(SNAPSHOT_CSV_URL);
      const csv = await res.text();
      const rows = csv.split("\n").slice(1);
      listed = rows.map(r => r.split(",")).filter(cols => cols[3]?.toLowerCase().trim() === "yes");

      const container = document.getElementById("me-listed-grid");
      container.innerHTML = "";

      listed.forEach(cols => {
        const nftNumber = cols[9]?.trim();
        const inscriptionId = cols[0]?.trim();
        const imageURL = `${imageBaseURL}${nftNumber}.webp`;
        const meURL = `https://magiceden.io/ordinals/item-details/${inscriptionId}`;

        const nftDiv = document.createElement("div");
        nftDiv.style.textAlign = "center";
        nftDiv.style.width = "300px";
        nftDiv.innerHTML = `
          <img src="${imageURL}" alt="Owl #${nftNumber}" />
          <p>Owl #${nftNumber}</p>
          <a href="${meURL}" target="_blank">
            <button>Buy on ME</button>
          </a>
        `;
        container.appendChild(nftDiv);
      });

      setInterval(() => {
        currentIndex++;
        if (currentIndex >= listed.length) currentIndex = 0;
        container.scrollTo({
          left: currentIndex * (300 + 16),
          behavior: 'smooth'
        });
      }, 3000);
    }

    window.addEventListener("DOMContentLoaded", fetchListedNFTsGrid);
  </script>
</body>
</html>
