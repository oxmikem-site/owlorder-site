<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connect Wallet</title>
  <script src="https://wallet.xverse.app/sats-connect.js"></script>
  <script>
    async function connectWallet() {
      if (!window.SatsConnect) {
        alert("SatsConnect не знайдено. Переконайся, що Xverse/Unisat активні.");
        return;
      }

      window.SatsConnect.showConnect({
        payload: {
          purposes: ['ordinals', 'payment'],
          message: 'Connect to OWL',
          network: { type: 'Mainnet' },
        },
        onFinish: (response) => {
          console.log('Connected:', response);
          alert('Підключено: ' + response.address);
        },
        onCancel: () => {
          alert('Користувач скасував підключення');
        },
      });
    }
  </script>
</head>
<body style="background: black; color: white; text-align: center;">
  <h1>Connect Wallet</h1>
  <button onclick="connectWallet()">Connect Wallet</button>
</body>
</html>
