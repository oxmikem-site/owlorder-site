<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OWL Wallet Connect</title>
  <style>
    body { background: #000; color: #fff; font-family: Arial,sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin:0; }
    button { margin: 10px; padding: 14px 24px; font-size: 18px; border-radius: 8px; background: #111; color: #fff; border:none; cursor:pointer; }
    button:hover { background: #222; }
    #status { margin-top: 20px; font-weight: 600; min-height: 20px; }
  </style>
</head>
<body>

  <h1>Connect Your Wallet</h1>

  <button id="btn-unisat">Connect Unisat</button>
  <button id="btn-xverse">Connect Xverse</button>

  <div id="status"></div>

  <script>
    const COLLECTION_TICK = "OWL"; // твій тикер

    const statusEl = document.getElementById('status');

    function setStatus(msg, error = false) {
      statusEl.textContent = msg;
      statusEl.style.color = error ? 'tomato' : 'lightgreen';
    }

    async function checkNFT(address) {
      try {
        const res = await fetch(`https://open-api.unisat.io/v1/indexer/address/${address}/inscriptions`);
        if (!res.ok) throw new Error(`API error: ${res.status}`);
        const data = await res.json();
        return data.data.some(inscription => {
          const tick = inscription.meta?.tick || inscription.meta?.ticker || inscription.meta?.collectionTick;
          return tick && tick.toUpperCase() === COLLECTION_TICK;
        });
      } catch(e) {
        console.error(e);
        return false;
      }
    }

    async function connectUnisat() {
      if (!window.unisat) {
        setStatus("Please install Unisat Wallet", true);
        return;
      }
      try {
        setStatus("Connecting to Unisat...");
        const accounts = await window.unisat.requestAccounts();
        if (!accounts.length) throw new Error("No accounts found");
        const address = accounts[0];
        setStatus(`Connected: ${address}. Checking NFT...`);
        const owns = await checkNFT(address);
        if (owns) {
          setStatus("✅ NFT verified! Redirecting...");
          setTimeout(() => window.location.href = "/dashboard.html", 1500);
        } else {
          setStatus("❌ NFT not found in your wallet", true);
        }
      } catch (e) {
        setStatus(e.message || e, true);
      }
    }

    async function connectXverse() {
      if (!window.xverse) {
        setStatus("Please install Xverse Wallet", true);
        return;
      }
      try {
        setStatus("Connecting to Xverse...");
        const accounts = await window.xverse.requestAccounts();
        if (!accounts.length) throw new Error("No accounts found");
        const address = accounts[0];
        setStatus(`Connected: ${address}. Checking NFT...`);
        const owns = await checkNFT(address);
        if (owns) {
          setStatus("✅ NFT verified! Redirecting...");
          setTimeout(() => window.location.href = "/dashboard.html", 1500);
        } else {
          setStatus("❌ NFT not found in your wallet", true);
        }
      } catch (e) {
        setStatus(e.message || e, true);
      }
    }

    document.getElementById('btn-unisat').onclick = connectUnisat;
    document.getElementById('btn-xverse').onclick = connectXverse;
  </script>
</body>
</html>
