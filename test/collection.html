<!DOCTYPE html>
<html>
  <head>
    <title>Connect Taproot Wallet</title>
    <meta charset="UTF-8" />
    <style>
      body {
        background: black;
        color: white;
        font-family: sans-serif;
        text-align: center;
        margin-top: 100px;
      }

      button {
        background: #fff065;
        color: black;
        padding: 10px 20px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Connect Taproot Wallet</h1>
    <button id="connectWallet">Connect Wallet</button>
    <p id="address"></p>

    <script>
      document.getElementById("connectWallet").addEventListener("click", async () => {
        if (!window.SatsConnect) {
          alert("SatsConnect не знайдено. Перевірте, чи встановлено Xverse або Unisat.");
          return;
        }

        try {
          const response = await window.SatsConnect.request("getAddresses", {
            payload: {
              purposes: ["payment"],
              network: {
                type: "Mainnet",
              },
            },
            onFinish: (response) => {
              console.log("Addresses:", response);
              document.getElementById("address").innerText =
                "Connected: " + response.addresses[0].address;
            },
            onCancel: () => {
              alert("Підключення скасовано.");
            },
          });
        } catch (err) {
          console.error("Помилка при запиті адрес:", err);
        }
      });
    </script>
  </body>
</html>
