<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OWL Wallet Connect</title>
  <script src="https://unpkg.com/@sats-connect/core@latest/dist/index.umd.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .modal {
      background: rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 20px #222;
      max-width: 320px;
      width: 100%;
    }

    .modal h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .wallet-button {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background-color: #111;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .wallet-button:hover {
      background-color: #222;
    }
  </style>
</head>
<body>

<div class="modal">
  <h2>Select Wallet</h2>
  <button class="wallet-button" onclick="connectWallet('unisat')">Unisat</button>
  <button class="wallet-button" onclick="connectWallet('xverse')">Xverse</button>
  <button class="wallet-button" onclick="connectWallet('leather')">Leather</button>
  <button class="wallet-button" onclick="connectWallet('magicEden')">Magic Eden</button>
  <button class="wallet-button" onclick="connectWallet('okx')">OKX</button>
  <button class="wallet-button" onclick="connectWallet('oyl')">Oyl</button>
</div>

<script>
  async function connectWallet(provider) {
    if (!window.satsConnect) {
      alert("SatsConnect is not loaded.");
      return;
    }

    const { selectWallet, getAccounts } = window.satsConnect;

    try {
      const selected = await selectWallet({
        provider,
        network: {
          type: 'Mainnet'
        }
      });

      if (!selected) {
        alert("Wallet not selected or not available.");
        return;
      }

      const accounts = await getAccounts();

      if (!accounts || accounts.length === 0) {
        alert("No accounts found.");
        return;
      }

      alert("Connected address: " + accounts[0].address);
      console.log("Accounts:", accounts);
    } catch (error) {
      console.error("Connection error:", error);
      alert("Error: " + error.message);
    }
  }
</script>

</body>
</html>
