<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connect Wallet</title>
  <style>
    body {
      background-color: #0e0e0e;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    #modal {
      background: rgba(30, 30, 30, 0.95);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 300px;
    }

    .wallet-button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #202020;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    .wallet-button:hover {
      background-color: #333;
    }
  </style>
</head>
<body>

<div id="modal">
  <h3>Select Wallet</h3>
  <button class="wallet-button" onclick="connectWallet('unisat')">Unisat</button>
  <button class="wallet-button" onclick="connectWallet('xverse')">Xverse</button>
  <button class="wallet-button" onclick="connectWallet('leather')">Leather</button>
  <button class="wallet-button" onclick="connectWallet('magicEden')">Magic Eden</button>
  <button class="wallet-button" onclick="connectWallet('okx')">OKX</button>
  <button class="wallet-button" onclick="connectWallet('oyl')">Oyl</button>
</div>

<script>
  const walletSources = {
    unisat: window.unisat,
    xverse: window.bitcoin || window.xverseProviders?.bitcoin,
    leather: window.BitcoinProvider,
    magicEden: window.magicEden?.bitcoin,
    okx: window.okxwallet?.bitcoin,
    oyl: window.oylwallet?.bitcoin,
  };

  async function connectWallet(walletId) {
    const provider = walletSources[walletId];
    if (!provider) {
      alert("Wallet not available: " + walletId);
      return;
    }

    try {
      let address = null;

      if (provider.request) {
        try {
          // Unisat or wallets that support getAddresses
          const result = await provider.request({
            method: 'getAddresses',
            params: { network: 'Mainnet' },
          });
          address = result?.addresses?.[0]?.address || JSON.stringify(result);
        } catch (e) {
          // Fallback to requestAccounts
          if (typeof provider.requestAccounts === 'function') {
            const result = await provider.requestAccounts();
            address = result?.[0] || 'Connected';
          } else {
            throw e;
          }
        }
      } else if (provider.connect) {
        const result = await provider.connect();
        address = result?.accounts?.[0]?.address || 'Connected';
      }

      if (!address) address = "Connected";

      alert(`Connected: ${address}`);
      console.log("Connected wallet:", walletId, address);
    } catch (err) {
      console.error(err);
      alert("Connection failed: " + err.message);
    }
  }
</script>

</body>
</html>
