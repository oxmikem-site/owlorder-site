<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OWL Wallet Connect + Auth</title>
  <style>
    body {
      margin: 0; padding: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    button {
      margin: 10px;
      padding: 14px 24px;
      font-size: 18px;
      border-radius: 8px;
      background: #111;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background 0.25s ease;
    }
    button:hover:not(:disabled) {
      background: #222;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      margin-top: 20px;
      min-height: 30px;
      font-weight: 600;
      text-align: center;
      max-width: 400px;
    }
  </style>
</head>
<body>

<h1>Connect and Authenticate Your Wallet</h1>

<button id="btn-unisat">Connect Unisat</button>
<button id="btn-xverse">Connect Xverse</button>

<div id="status">Status messages will appear here...</div>

<script>
  // Вкажіть тут URL вашого бекенду, який розгорнули (Render, Heroku і т.д.)
  const API_BASE = 'https://wallet-auth-backend-mer0.onrender.com/api';

  const COLLECTION_TICK = "OWL"; // Тикер вашої NFT колекції

  class BaseWallet {
    constructor(name) {
      this.name = name;
      this.accounts = [];
    }
    async connect() {
      throw new Error('Method connect() must be implemented');
    }
    async getAccounts() {
      return this.accounts;
    }
    async signMessage(msg) {
      throw new Error('Method signMessage() must be implemented');
    }
  }

  class UnisatWallet extends BaseWallet {
    constructor() {
      super('unisat');
    }
    async connect() {
      if (!window.unisat) throw new Error('Unisat wallet not found');
      this.accounts = await window.unisat.requestAccounts();
      if (!this.accounts.length) throw new Error('No accounts found in Unisat');
    }
    async signMessage(msg) {
      return window.unisat.signMessage(msg);
    }
  }

  class XverseWallet extends BaseWallet {
    constructor() {
      super('xverse');
    }
    async waitForXverse(timeout = 5000) {
      return new Promise((resolve, reject) => {
        if (window.xverse) resolve(window.xverse);
        else {
          let waited = 0;
          const interval = setInterval(() => {
            if (window.xverse) {
              clearInterval(interval);
              resolve(window.xverse);
            } else if ((waited += 100) >= timeout) {
              clearInterval(interval);
              reject(new Error("Xverse wallet not found"));
            }
          }, 100);
        }
      });
    }
    async connect() {
      await this.waitForXverse();
      this.accounts = await window.xverse.requestAccounts();
      if (!this.accounts.length) throw new Error('No accounts found in Xverse');
    }
    async signMessage(msg) {
      return window.xverse.signMessage(msg);
    }
  }

  class WalletManager {
    constructor() {
      this.wallets = {
        unisat: new UnisatWallet(),
        xverse: new XverseWallet(),
      };
    }
    async connect(providerName) {
      const wallet = this.wallets[providerName];
      if (!wallet) throw new Error(`Wallet provider '${providerName}' is not supported`);
      await wallet.connect();
      return wallet;
    }
  }

  const statusEl = document.getElementById('status');
  function setStatus(msg, error = false) {
    statusEl.textContent = msg;
    statusEl.style.color = error ? 'tomato' : 'lightgreen';
  }

  // Запит nonce у бекенду
  async function fetchNonce(address) {
    const res = await fetch(`${API_BASE}/auth/nonce?address=${encodeURIComponent(address)}`);
    if (!res.ok) throw new Error(`Failed to fetch nonce: ${res.status}`);
    const data = await res.json();
    return data.nonce;
  }

  // Перевірка підпису на бекенді, отримання токена
  async function verifySignature(address, signature) {
    const res = await fetch(`${API_BASE}/auth/verify`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({address, signature}),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'Verification failed');
    }
    const data = await res.json();
    return data.token;
  }

  // Перевірка наявності NFT через Unisat API
  async function checkNFT(address) {
    try {
      const res = await fetch(`https://open-api.unisat.io/v1/indexer/address/${address}/inscriptions`);
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      const data = await res.json();
      return data.data.some(inscription => {
        const tick = inscription.meta?.tick || inscription.meta?.ticker || inscription.meta?.collectionTick;
        return tick && tick.toUpperCase() === COLLECTION_TICK;
      });
    } catch (e) {
      console.error(e);
      return false;
    }
  }

  // Основний процес підключення, аутентифікації і перевірки NFT
  async function connectAndAuthenticate(provider) {
    setStatus(`Connecting to ${provider}...`);
    const manager = new WalletManager();
    try {
      const wallet = await manager.connect(provider);
      const accounts = await wallet.getAccounts();
      const address = accounts[0];
      setStatus(`Connected: ${address}. Fetching nonce...`);

      const nonce = await fetchNonce(address);
      setStatus(`Please sign the authentication message...`);

      const signature = await wallet.signMessage(nonce);

      setStatus(`Verifying signature...`);

      const token = await verifySignature(address, signature);

      setStatus('Authentication successful! Checking NFT ownership...');

      const ownsNFT = await checkNFT(address);

      if (ownsNFT) {
        setStatus('✅ NFT verified! Redirecting...');
        localStorage.setItem('authToken', token);
        setTimeout(() => window.location.href = "/dashboard.html", 1500);
      } else {
        setStatus('❌ NFT not found in your wallet', true);
      }
    } catch (e) {
      setStatus(e.message || e, true);
    }
  }

  // Прив’язка кнопок
  document.getElementById('btn-unisat').onclick = () => connectAndAuthenticate('unisat');
  document.getElementById('btn-xverse').onclick = () => connectAndAuthenticate('xverse');
</script>

</body>
</html>
