<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OWL Wallet Connect</title>
  <style>
    body {
      margin: 0; padding: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    button {
      margin: 10px;
      padding: 14px 24px;
      font-size: 18px;
      border-radius: 8px;
      background: #111;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background 0.25s ease;
    }
    button:hover:not(:disabled) {
      background: #222;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      margin-top: 20px;
      min-height: 24px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<h1>Connect Your Wallet</h1>

<button id="btn-unisat">Connect Unisat</button>
<button id="btn-xverse">Connect Xverse</button>

<div id="status"></div>

<script>
  const COLLECTION_TICK = "OWL"; // твій тикер

  // Базовий клас гаманця
  class BaseWallet {
    constructor(name) {
      this.name = name;
      this.accounts = [];
    }
    async connect() {
      throw new Error('Method connect() must be implemented');
    }
    async getAccounts() {
      return this.accounts;
    }
  }

  // Unisat
  class UnisatWallet extends BaseWallet {
    constructor() {
      super('unisat');
    }
    async connect() {
      if (!window.unisat) throw new Error('Unisat wallet not found');
      this.accounts = await window.unisat.requestAccounts();
      if (!this.accounts.length) throw new Error('No accounts found in Unisat');
    }
  }

  // Xverse
  class XverseWallet extends BaseWallet {
    constructor() {
      super('xverse');
    }

    // Очікуємо появи window.xverse до 5 сек
    async waitForXverse(timeout = 5000) {
      return new Promise((resolve, reject) => {
        if (window.xverse) resolve(window.xverse);
        else {
          let waited = 0;
          const interval = setInterval(() => {
            if (window.xverse) {
              clearInterval(interval);
              resolve(window.xverse);
            } else if ((waited += 100) >= timeout) {
              clearInterval(interval);
              reject(new Error("Xverse wallet not found"));
            }
          }, 100);
        }
      });
    }

    async connect() {
      await this.waitForXverse();
      this.accounts = await window.xverse.requestAccounts();
      if (!this.accounts.length) throw new Error('No accounts found in Xverse');
    }
  }

  // Менеджер гаманців
  class WalletManager {
    constructor() {
      this.wallets = {
        unisat: new UnisatWallet(),
        xverse: new XverseWallet(),
      };
    }

    async connect(providerName) {
      const wallet = this.wallets[providerName];
      if (!wallet) throw new Error(`Wallet provider '${providerName}' is not supported`);
      await wallet.connect();
      return wallet;
    }
  }

  // Статус
  const statusEl = document.getElementById('status');
  function setStatus(msg, error = false) {
    statusEl.textContent = msg;
    statusEl.style.color = error ? 'tomato' : 'lightgreen';
  }

  // Перевірка NFT через API Unisat
  async function checkNFT(address) {
    try {
      const res = await fetch(`https://open-api.unisat.io/v1/indexer/address/${address}/inscriptions`);
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      const data = await res.json();
      return data.data.some(inscription => {
        const tick = inscription.meta?.tick || inscription.meta?.ticker || inscription.meta?.collectionTick;
        return tick && tick.toUpperCase() === COLLECTION_TICK;
      });
    } catch (e) {
      console.error(e);
      return false;
    }
  }

  // Обробка підключення
  async function connectAndCheck(provider) {
    setStatus(`Connecting to ${provider}...`);
    const manager = new WalletManager();
    try {
      const wallet = await manager.connect(provider);
      const accounts = await wallet.getAccounts();
      const address = accounts[0];
      setStatus(`Connected: ${address}. Checking NFT ownership...`);
      const ownsNFT = await checkNFT(address);
      if (ownsNFT) {
        setStatus('✅ NFT verified! Redirecting...');
        setTimeout(() => window.location.href = "/dashboard.html", 1500);
      } else {
        setStatus('❌ NFT not found in your wallet', true);
      }
    } catch (e) {
      setStatus(e.message || e, true);
    }
  }

  document.getElementById('btn-unisat').onclick = () => connectAndCheck('unisat');
  document.getElementById('btn-xverse').onclick = () => connectAndCheck('xverse');
</script>

</body>
</html>
