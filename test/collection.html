<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connect Taproot Wallet</title>
  <script src="https://unpkg.com/@sats-connect/sdk@latest/dist/index.umd.js"></script>
</head>
<body style="background:black; color:white; text-align:center; font-family:sans-serif;">
  <h1>Connect Wallet</h1>
  <button id="connectBtn">Connect Wallet</button>
  <p id="result"></p>

  <script>
    const connectButton = document.getElementById("connectBtn");
    const result = document.getElementById("result");

    connectButton.onclick = async () => {
      try {
        if (!window.satsConnect) {
          alert("SatsConnect не знайдено. Переконайтесь, що гаманець Xverse/Unisat активний.");
          return;
        }

        const getAddressResponse = await window.satsConnect.getAddress({
          payload: {
            purposes: ["payment"],
            message: "Connect to OWL Dashboard",
            network: {
              type: "Mainnet"
            }
          },
          onFinish: (response) => {
            console.log("Address response:", response);
            result.innerText = `Connected Taproot Address:\n${response.addresses[0].address}`;
          },
          onCancel: () => {
            result.innerText = "❌ Підключення скасовано користувачем.";
          }
        });
      } catch (error) {
        console.error("Connection error:", error);
        result.innerText = `❌ Помилка: ${error.message}`;
      }
    };
  </script>
</body>
</html>
