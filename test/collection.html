<!DOCTYPE html>
<html>
  <head>
    <title>SatsConnect Wallet Test</title>
    <script>
      async function connectWallet() {
        if (!window.SatsConnect) {
          alert("SatsConnect не знайдено. Перевірте, чи встановлено Xverse або Unisat.");
          return;
        }

        try {
          await window.SatsConnect.showConnect({
            payload: {
              purposes: ['ordinals', 'payment'],
              message: 'Connect to OWL',
              network: {
                type: 'Mainnet'
              }
            },
            onFinish: (response) => {
              console.log('✅ Connected:', response);
              document.getElementById("wallet").innerText =
                "Connected: " + response.address;
            },
            onCancel: () => {
              console.warn('❌ User cancelled connection');
            }
          });
        } catch (e) {
          console.error("Error:", e);
        }
      }
    </script>
  </head>
  <body style="background:black; color:white; text-align:center; padding-top:100px;">
    <h1>Connect Taproot Wallet</h1>
    <button onclick="connectWallet()">Connect Wallet</button>
    <p id="wallet"></p>
  </body>
</html>
