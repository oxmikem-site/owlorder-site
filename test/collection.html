<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OWL Wallet Connect</title>
  <script src="../libs/sats-connect/index.umd.js" defer></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .modal {
      background: rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 20px #222;
      max-width: 320px;
      width: 100%;
    }

    .modal h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .wallet-button {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background-color: #111;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .wallet-button:hover {
      background-color: #222;
    }
  </style>
</head>
<body>

<div class="modal" id="connect-modal">
  <h2>Select Wallet</h2>
  <button class="wallet-button" onclick="connectWallet('unisat')">Unisat</button>
  <button class="wallet-button" onclick="connectWallet('xverse')">Xverse</button>
  <button class="wallet-button" onclick="connectWallet('leather')">Leather</button>
  <button class="wallet-button" onclick="connectWallet('magiceden')">Magic Eden</button>
  <button class="wallet-button" onclick="connectWallet('okx')">OKX</button>
  <button class="wallet-button" onclick="connectWallet('oyl')">Oyl</button>
</div>

<script>
  const COLLECTION_TICK = "OWL"; // 🟡 Заміни на свій реальний ticker

  async function connectWallet(provider) {
    if (!window.satsConnect || !window.satsConnect.selectWallet || !window.satsConnect.getAccounts) {
      alert("SatsConnect is not ready.");
      return;
    }

    try {
      const wallet = await window.satsConnect.selectWallet(provider);
      if (!wallet) {
        alert("Wallet not selected or not available.");
        return;
      }

      const accounts = await window.satsConnect.getAccounts(wallet);

      if (!accounts || accounts.length === 0) {
        alert("No accounts found.");
        return;
      }

      const address = accounts[0];
      console.log("Connected address:", address);

      // 🔍 Перевіряємо наявність NFT
      const has = await hasNFT(address);
      if (has) {
        showFullSite();
      } else {
        showAccessDenied();
      }

    } catch (error) {
      console.error("Connection error:", error);
      alert("Error: " + error.message);
    }
  }

  async function hasNFT(address) {
    try {
      const response = await fetch(`https://open-api.unisat.io/v1/indexer/address/${address}/brc20/summary`);
      const data = await response.json();
      if (!data || !data.data) return false;

      return data.data.some(token => token.tick.toUpperCase() === COLLECTION_TICK);
    } catch (err) {
      console.error("Failed to fetch NFT data:", err);
      return false;
    }
  }

  function showFullSite() {
    alert("✅ Access granted. You own an NFT.");
    window.location.href = "/dashboard.html"; // 🟢 Замінити на свою головну сторінку
  }

  function showAccessDenied() {
    alert("❌ You don't own any NFTs from the collection.");
  }
</script>

</body>
</html>
