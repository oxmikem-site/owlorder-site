<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connect UniSat Wallet</title>
</head>
<body style="background:black; color:white; font-family:sans-serif; text-align:center; padding-top:100px;">
  <h1>Connect UniSat Wallet</h1>
  <button onclick="connect()">Connect Wallet</button>
  <p id="address"></p>

  <script>
    async function connect() {
      if (!window.unisat) {
        alert("UniSat Wallet is not installed!");
        return;
      }

      try {
        const accounts = await window.unisat.requestAccounts();
        const address = accounts[0];
        document.getElementById("address").innerText = `Connected: ${address}`;
        console.log("Connected address:", address);
        localStorage.setItem("taproot_wallet", address);
      } catch (e) {
        console.error("Connection error", e);
        alert("Failed to connect: " + e.message);
      }
    }
  </script>
</body>
</html>
