<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connect Wallet</title>
  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: sans-serif;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal {
      background-color: #1a1a1a;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 300px;
    }

    .wallet-button {
      background-color: #fff065;
      color: black;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      margin: 10px 0;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .wallet-button:hover {
      background-color: #ffea38;
    }
  </style>
</head>
<body>

<!-- Modal -->
<div class="overlay" id="walletModal">
  <div class="modal">
    <h2>Connect your wallet</h2>
    <button class="wallet-button" onclick="connectUnisat()">Unisat</button>
    <button class="wallet-button" onclick="connectXverse()">Xverse</button>
  </div>
</div>

<!-- JS Logic -->
<script>
  function connectUnisat() {
    if (window.unisat) {
      window.unisat.requestAccounts()
        .then(accounts => {
          alert("Connected Unisat: " + accounts[0]);
          document.getElementById("walletModal").style.display = "none";
        })
        .catch(err => alert("Unisat Error: " + err));
    } else {
      alert("Unisat wallet not found");
    }
  }

  function connectXverse() {
    if (window.BitcoinProvider) {
      const request = {
        method: 'getAddresses',
        params: {
          purposes: ['ordinals'],
          network: 'Mainnet',
        }
      };

      window.BitcoinProvider.request(request)
        .then(response => {
          const address = response.addresses[0]?.address;
          alert("Connected Xverse: " + address);
          document.getElementById("walletModal").style.display = "none";
        })
        .catch(error => alert("Xverse Error: " + error));
    } else {
      alert("Xverse wallet not found");
    }
  }
</script>

</body>
</html>
