<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connect Wallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: #0d0d0d;
      color: #fff;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    .wallet-btn {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 12px 16px;
      margin: 10px auto;
      display: block;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .wallet-btn:hover {
      background: #333;
    }
  </style>
</head>
<body>

  <div class="overlay" id="walletModal">
    <div class="modal">
      <h2>Select Wallet</h2>
      <button class="wallet-btn" data-wallet="xverse">Xverse</button>
      <button class="wallet-btn" data-wallet="unisat">Unisat</button>
      <button class="wallet-btn" data-wallet="magiceden">Magic Eden</button>
      <button class="wallet-btn" data-wallet="okx">OKX</button>
      <button class="wallet-btn" data-wallet="leather">Leather</button>
      <button class="wallet-btn" data-wallet="oyl">Oyl</button>
    </div>
  </div>

  <script>
    document.querySelectorAll('.wallet-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const provider = btn.dataset.wallet;

        let address = null;

        try {
          switch(provider) {
            case 'xverse':
              if (!window.BitcoinProvider) throw new Error('Xverse not found');
              const result = await window.BitcoinProvider.request({ method: "getAddresses" });
              address = result.result.addresses[0].address;
              break;

            case 'unisat':
              if (!window.unisat) throw new Error('Unisat not found');
              const addresses = await window.unisat.requestAccounts();
              address = addresses[0];
              break;

            case 'magiceden':
              if (!window.magiceden) throw new Error('Magic Eden wallet not detected');
              // TODO: Replace with real API call once identified
              break;

            case 'okx':
              if (!window.okxwallet) throw new Error('OKX wallet not detected');
              // TODO: Replace with real API call once identified
              break;

            case 'leather':
              if (!window.leather) throw new Error('Leather wallet not detected');
              // TODO: Replace with real API call once identified
              break;

            case 'oyl':
              if (!window.oyl) throw new Error('Oyl wallet not detected');
              // TODO: Replace with real API call once identified
              break;
          }

          if (address) {
            window.dispatchEvent(new CustomEvent("wallet.connected", {
              detail: { provider, address }
            }));
            document.getElementById('walletModal').style.display = 'none';
          }

        } catch (e) {
          alert(e.message);
        }
      });
    });
  </script>
</body>
</html>
