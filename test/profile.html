<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OWL Wallet Connect</title>
  <script src="./owl-bundle.umd.js" defer></script> <!-- Вставити сюди зібраний скрипт -->
  <style>
    body {
      background-color: #000;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    select, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }

    #result {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h2>🦉 Connect to Wallet</h2>

  <label for="walletSelect">Choose Wallet:</label>
  <select id="walletSelect">
    <option value="xverse">Xverse</option>
    <option value="unisat">Unisat</option>
    <option value="hiro">Hiro</option>
    <option value="leather">Leather</option>
    <option value="okx">OKX</option>
    <option value="bitget">Bitget</option>
  </select>

  <button id="connectBtn">Connect</button>

  <div id="result">Not connected</div>

  <script>
    document.getElementById("connectBtn").onclick = async () => {
      const wallet = document.getElementById("walletSelect").value;
      let provider;

      if (wallet === "xverse" && window.xverse?.bitcoin) provider = window.xverse.bitcoin;
      else if (wallet === "unisat" && window.unisat) provider = window.unisat;
      else if (wallet === "hiro" && window.btc) provider = window.btc;
      else if (wallet === "leather" && window.leather?.bitcoin) provider = window.leather.bitcoin;
      else if (wallet === "okx" && window.okxwallet?.bitcoin) provider = window.okxwallet.bitcoin;
      else if (wallet === "bitget" && window.bitkeep?.bitcoin) provider = window.bitkeep.bitcoin;
      else {
        document.getElementById("result").textContent = "❌ Wallet not found";
        return;
      }

      try {
        const response = await provider.request('getAddresses');
        const taprootAddress = response.addresses?.find(a => a.type === 'p2tr')?.address;

        if (!taprootAddress) throw new Error("Taproot address not found");

        document.getElementById("result").textContent = `✅ Connected: ${taprootAddress}`;
        console.log("Address:", taprootAddress);

        const relayUrl = createWebSocketURL("wss://relay.damus.io");
        const relay = connectToRelay(relayUrl);
        const signed = await signMessage(provider, taprootAddress, "Sign this message to login", relay);

        console.log("Signature OK", signed);
      } catch (err) {
        console.error(err);
        document.getElementById("result").textContent = `❌ Error: ${err.message}`;
      }
    };
  </script>

</body>
</html>
