<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Check Xverse Wallet</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      background-color: #222;
      color: #fff;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #555;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <button id="btn-check">Check Xverse</button>
  <div id="result"></div>

  <script>
    document.getElementById('btn-check').addEventListener('click', () => {
      const res = window.xverse ? 'Xverse detected!' : 'Xverse NOT found!';
      document.getElementById('result').textContent = res;
      console.log('window.xverse:', window.xverse);
    });
  </script>

</body>
</html>
