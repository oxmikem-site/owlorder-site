<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OWL Collection</title>
  <link rel="icon" type="image/png" href="../logo2.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

  <style>
    :root{
      --bg-dark:#000;
      --bg-panel:linear-gradient(145deg,#141414,#0f0f0f);
      --text-primary:#e6e6e6;
      --text-secondary:#9f9f9f;
      --accent:#fff065;
      --accent-muted:#8a7f5a;
    }
    *{ box-sizing:border-box; }
    html,body{
      height:100vh; margin:0; overflow:hidden;
      background:var(--bg-dark); color:var(--text-primary);
      font-family:'Inter',sans-serif;
    }

    /* ---------- HEADER (єдиний стиль із профілем/лідербордом) ---------- */
    .site-header{
      width:100%; max-width:1000px; margin:20px auto 0;
      height:64px; min-height:64px;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 14px 0 20px; border-radius:20px;
      background:linear-gradient(145deg,#1b1b1b,#101010);
      border:1px solid rgba(255,255,255,.05);
      box-shadow:0 4px 10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.4);
      position:relative; z-index:10;
    }
    .logo{ display:flex; align-items:center; gap:12px; }
    .logo img{ width:50px; height:50px; }
    .nav-buttons{ display:flex; align-items:center; gap:4px; }
    .button{
      padding:8px 10px; background:transparent; border:none; color:var(--text-primary);
      text-decoration:none; font-weight:500; font-size:18px; transition:.2s; margin-left:10px;
    }
    .button:hover{ color:var(--accent); }
    .twitter-icon{ width:26px; height:26px; margin-left:20px; }

    .wallet-wrapper{ position:relative; display:flex; align-items:center; gap:8px; }
    .connect-wallet{
      background:#202020; border:1px solid #333; color:#e6e6e6; border-radius:12px; padding:10px 14px;
      font-weight:600; cursor:pointer; transition:.15s;
    }
    .connect-wallet:hover{ border-color:#fff065; color:#fff065; }
    .wallet-dropdown-content{
      display:none; position:absolute; right:0; top:52px; background:#141414; border:1px solid #333;
      border-radius:12px; min-width:200px; box-shadow:0 10px 30px rgba(0,0,0,.5); padding:6px; z-index:20;
    }
    .wallet-dropdown-content .dd-item,
    .wallet-dropdown-content .dd-line{
      display:block; width:100%; text-align:left; padding:10px 12px; border-radius:10px;
      color:#e6e6e6; background:transparent; border:none; cursor:pointer; font:inherit;
    }
    .wallet-dropdown-content .dd-item:hover{ background:#1d1d1d; }
    .wallet-dropdown-content .short-addr{ color:#9f9f9f; cursor:default; }

    /* ---------- SIDE ART ---------- */
    :root{
      --side-art-top: 95px;
      --side-art-offset: -60px;
      --side-art-width: 720px;
    }
    .side-image{
      position:absolute; top:var(--side-art-top);
      width:min(44vw, var(--side-art-width));
      opacity:1; pointer-events:none; z-index:0;
      filter:drop-shadow(0 0 24px rgba(0,0,0,.45));
    }
    .side-left{ left:var(--side-art-offset); }
    .side-right{ right:var(--side-art-offset); }
    @media (min-width:1440px){
      :root{ --side-art-top:85px; --side-art-offset:-80px; --side-art-width:780px; }
    }
    @media (max-width:1024px){
      :root{ --side-art-top:110px; --side-art-offset:-24px; }
      .side-image{ width:54vw; opacity:.85; }
    }
    @media (max-width:640px){
      .side-image{ display:none; }
    }

    /* ---------- MAIN ---------- */
    .main-wrapper{
      width:100%; max-width:1000px; height:calc(100vh - 100px);
      margin:0 auto; overflow-y:auto; padding:20px; position:relative;
      scrollbar-width:none; -ms-overflow-style:none;
    }
    .main-wrapper::-webkit-scrollbar{ display:none; }

    .grid{
      position:relative; z-index:1;
      display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
      gap:14px;
    }

    /* Картка NFT у стилі панелей */
    .nft-card{
      position:relative; overflow:hidden; border-radius:12px;
      background:var(--bg-panel);
      border:1px solid rgba(255,255,255,.05);
      box-shadow:0 4px 10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.4);
      transition:transform .18s ease;
      cursor:pointer;
    }
    .nft-card:hover{ transform:scale(1.01); }

    .nft-thumb{
      width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
      background:#0f0f0f;
    }
    .nft-thumb img{
      display:block; width:100%; height:100%; object-fit:cover;
    }

    .nft-meta{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px 12px; border-top:1px solid rgba(255,255,255,.06);
      background:linear-gradient(145deg,#1b1b1b,#121212);
    }
    .nft-number{ font-weight:700; letter-spacing:.3px; }
    .rarity-badge{
      font-size:12px; line-height:1; padding:6px 8px; border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:#151515; color:#ddd; white-space:nowrap;
    }
    .rarity-common{ color:#d7d7d7; }
    .rarity-uncommon{ color:#a1e3a1; border-color:rgba(161,227,161,.25); }
    .rarity-rare{ color:#80c7ff; border-color:rgba(128,199,255,.25); }
    .rarity-epic{ color:#d7a7ff; border-color:rgba(215,167,255,.25); }
    .rarity-legendary{ color:#ffd86b; border-color:rgba(255,216,107,.35); }
    .rarity-mythic{ color:#ff8e8e; border-color:rgba(255,142,142,.35); }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="logo">
      <a href="/"><img src="../logo1.png" alt="logo" /></a>
    </div>

    <nav class="nav-buttons">
      <a href="/collection" class="button" style="color:var(--accent)">Collection</a>
      <a href="/leaderboard" class="button">Leaderboard</a>
      <a href="https://x.com/OwlOrderBTC" target="_blank" rel="noopener noreferrer" aria-label="X/Twitter">
        <img src="../twitter-white.png" alt="" class="twitter-icon" />
      </a>
    </nav>

    <div class="wallet-wrapper">
      <button id="wallet-header-btn" class="connect-wallet wallet-trigger">CONNECT WALLET</button>
      <div id="wallet-header-dropdown" class="wallet-dropdown-content">
        <div class="dd-line short-addr" id="wallet-short">–</div>
        <a class="dd-item" href="/profile/">Open Profile</a>
        <button class="dd-item logout-btn">Logout</button>
      </div>
    </div>
  </header>

  <!-- SIDE ART -->
  <img src="/LEFTSIDE2.png"  alt="" class="side-image side-left"  decoding="async" fetchpriority="low">
  <img src="/RIGHTSIDE2.png" alt="" class="side-image side-right" decoding="async" fetchpriority="low">

  <!-- MAIN -->
  <div class="main-wrapper">
    <div class="grid" id="grid"></div>
  </div>

  <script>
    /* -------- Firebase -------- */
    const firebaseConfig = {
      apiKey:"AIzaSyD2v-w99aaVgKYrycfIV515BEbjaTOp7z4",
      authDomain:"owl-chat-e4233.firebaseapp.com",
      databaseURL:"https://owl-chat-e4233-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:"owl-chat-e4233",
      storageBucket:"owl-chat-e4233.firebasestorage.app",
      messagingSenderId:"671987704789",
      appId:"1:671987704789:web:5ffad58bc9c00ba772935c",
      measurementId:"G-ELQRLCLGZT"
    };
    (firebase.apps && firebase.apps.length) ? firebase.app() : firebase.initializeApp(firebaseConfig);
    const db  = firebase.database(); const auth = firebase.auth();
    auth.signInAnonymously().catch(()=>{}); auth.onAuthStateChanged(u => { window.CURRENT_UID = u ? u.uid : null; });

    /* -------- Хедер утиліти -------- */
    function shorten(a){ return a ? a.slice(0,6)+'...'+a.slice(-4) : ''; }
    function getConnectedWalletAddress(){ return localStorage.getItem('taproot_wallet'); }
    function updateWalletUI(address){
      const btn = document.getElementById('wallet-header-btn');
      const short = document.getElementById('wallet-short');
      if (btn)   btn.textContent = address ? shorten(address) : 'CONNECT WALLET';
      if (short) short.textContent = address ? shorten(address) : '–';
    }

    /* -------- Sats-Connect loader -------- */
    window.loadSatsV3 = async function(){
      if (window.__sats) return window.__sats;
      const sources = [
        'https://cdn.jsdelivr.net/npm/sats-connect@3.6.1/+esm',
        'https://esm.sh/sats-connect@3.6.1',
        '/profile/sats-connect-3.6.1.esm.js'
      ];
      let last;
      for (const src of sources){
        try{
          const mod = await import(src);
          const request = mod?.request || mod?.default?.request;
          const AddressPurpose = mod?.AddressPurpose || mod?.default?.AddressPurpose;
          if (request && AddressPurpose){ window.__sats = { request, AddressPurpose }; return window.__sats; }
        }catch(e){ last = e; }
      }
      console.error('Failed to load sats-connect', last);
      throw new Error('sats-connect not available');
    };

    /* -------- Wallet picker (скорочено) -------- */
    function ensurePickerMask(){
      let m = document.getElementById('wallet-picker-mask');
      if (m) return m;
      m = document.createElement('div');
      m.id = 'wallet-picker-mask';
      m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10000;';
      document.body.appendChild(m);
      return m;
    }
    async function openWalletPicker(){
      const mask = ensurePickerMask(); mask.innerHTML=''; mask.style.display='flex';
      const box = document.createElement('div');
      box.style.cssText = 'width:360px;max-width:92vw;background:#141414;color:#eee;border:1px solid #333;border-radius:14px;padding:18px;';
      box.innerHTML = `
        <div style="font-size:18px;font-weight:600;margin-bottom:12px;">Connect wallet</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <button id="pick-unisat" style="display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;border-radius:10px;background:#1f1f1f;color:#fff;border:0;cursor:pointer;">
            <img src="/profile/unisat.png" width="20" height="20" alt="UniSat"><span>UniSat (Taproot)</span>
          </button>
          <button id="pick-xverse" style="display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;border-radius:10px;background:#1f1f1f;color:#fff;border:0;cursor:pointer;">
            <img src="/profile/xverse.png" width="20" height="20" alt="Xverse"><span>Xverse (Ordinals)</span>
          </button>
          <button id="pick-cancel" style="padding:10px;margin-top:6px;border-radius:10px;background:#222;color:#fff;border:0;cursor:pointer;">Cancel</button>
        </div>`;
      mask.appendChild(box);
      box.querySelector('#pick-unisat').onclick = async ()=>{ try{ await connectUniSatWallet(); } finally{ mask.style.display='none'; } };
      box.querySelector('#pick-xverse').onclick = async ()=>{ try{ await connectXverseWallet(); } finally{ mask.style.display='none'; } };
      box.querySelector('#pick-cancel').onclick = ()=> mask.style.display='none';
      mask.addEventListener('click',(e)=>{ if(e.target===mask) mask.style.display='none'; }, {once:true});
    }

    async function connectUniSatWallet(){
      if (!window.unisat){ alert('UniSat Wallet not found.'); return; }
      await window.unisat.requestAccounts();
      const address = (await window.unisat.getAccounts())[0];
      localStorage.setItem('taproot_wallet', address);
      updateWalletUI(address);
    }
    async function connectXverseWallet(){
      try{
        const hasXverse = !!window.BitcoinProvider || !!window.xverseProviders || (window?.bitcoin && typeof window.bitcoin.request === 'function');
        if (!hasXverse){ alert('Xverse не знайдено. Дозволь сайту доступ у налаштуваннях розширення.'); return; }

        const { request, AddressPurpose } = await window.loadSatsV3();
        const resp = await request('wallet_connect', {
          addresses: [AddressPurpose.Ordinals, AddressPurpose.Payment],
          message: 'Connect to OWL', network: 'Mainnet'
        });
        const addresses = resp?.result?.addresses || resp?.addresses || [];
        if (!Array.isArray(addresses) || !addresses.length){ alert('Xverse did not return the address.'); return; }
        const ord = addresses.find(a => (a.purpose||'').toLowerCase()==='ordinals');
        const address = (ord || addresses[0]).address;

        // необовʼязково: зберегти доказ підпису
        const nonce = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(x=>x.toString(16).padStart(2,'0')).join('');
        const message = `OWL login
Domain: ${location.origin}
Address: ${address}
Nonce: ${nonce}
Time: ${new Date().toISOString()}`;
        const sign = await request('signMessage', { address, message, signatureType:'bip322-simple' }).catch(()=>null);
        const signature = sign?.result?.signature || sign?.signature || '';
        const uid = (firebase.auth().currentUser || {}).uid;
        if (uid && signature){
          db.ref(`proofs/${address.toLowerCase()}`).set({ uid, wallet:'xverse', address, message, signature, createdAt:Date.now(), version:1 }).catch(()=>{});
        }

        localStorage.setItem('taproot_wallet', address);
        updateWalletUI(address);
      }catch(err){
        const msg = (err?.error?.message || err?.message || '').toString();
        if (/USER_REJECTION|rejected|cancel/i.test(msg)) alert('Запит у Xverse відхилено.');
        else { console.error(err); alert('Xverse connection failed.'); }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateWalletUI(getConnectedWalletAddress());

      const wrapper = document.querySelector('.wallet-wrapper');
      const dd = document.getElementById('wallet-header-dropdown');
      if (wrapper && dd){
        wrapper.addEventListener('click', (e)=>{
          e.stopPropagation();
          const addr = getConnectedWalletAddress();
          if (!addr){ openWalletPicker(); return; }
          dd.style.display = (dd.style.display === 'block' ? 'none' : 'block');
        });
      }
      document.addEventListener('click', ()=> {
        document.querySelectorAll('.wallet-dropdown-content').forEach(d => d.style.display='none');
      });
      document.querySelectorAll('.logout-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          localStorage.removeItem('taproot_wallet');
          updateWalletUI(null);
          document.getElementById('wallet-header-dropdown').style.display = 'none';
        });
      });
    });

   <script>
  /* -------- Collection grid (images, no 3D) -------- */
 const SNAPSHOT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdLAOdM_GrsuOclMYL9ltUVyzC_Y7Z_9Jf7ITs-tYuqj1ekgrsH76KGu14CyZ0li7vnROOSpn6FpnG/pub?output=csv&gid=0";

  // За замовчуванням (перезапишемо після парсингу)
  let TOTAL = 150;
  const grid = document.getElementById('grid');
  let rarityMap = {};

  // CSS-класи під колір бейджа
  function rarityClass(name){
    const v = (name || '').toLowerCase();
    if (v.includes('myth')) return 'rarity-mythic';
    if (v.includes('legen')) return 'rarity-legendary';
    if (v.includes('epic')) return 'rarity-epic';
    if (v.includes('rare')) return 'rarity-rare';
    if (v.includes('uncommon')) return 'rarity-uncommon';
    if (v.includes('common')) return 'rarity-common';
    return '';
  }

  // 2) Тягнемо рарність із CSV; шукаємо динамічно колонки ID та Rarity/Tier
  async function loadRaritiesFromSnapshot(){
    try{
      const res = await fetch(SNAPSHOT_CSV_URL, { cache: 'no-store' });
      const text = await res.text();

      // нормальний CSV парсер на regex (обробляє лапки/коми)
      const rows = text.trim().split('\n').map(r => {
        const m = r.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
        return m.map(c => c.replace(/^"|"$/g, '').trim());
      });

      const header = (rows[0] || []).map(h => h.toLowerCase());
      const idIdx = header.findIndex(h => /(^|[^a-z])(id|token|#|number|nft|owl)([^a-z]|$)/i.test(h));
      const rarityIdx = header.findIndex(h => /(rarity|tier|class|rank)/i.test(h));

      rarityMap = {};
      for (let i = 1; i < rows.length; i++){
        const row = rows[i];
        const rawId = (row[idIdx] || '').toString();
        const id = rawId.replace(/\D/g, ''); // лише цифри
        const rarity = row[rarityIdx] || 'Unknown';
        if (id) rarityMap[id] = rarity;
      }

      // якщо у снапшоті всі ID присутні — визначимо TOTAL автоматично
      const ids = Object.keys(rarityMap).map(n => +n).filter(n => Number.isFinite(n));
      const maxId = Math.max(...ids);
      if (ids.length && Number.isFinite(maxId)) TOTAL = maxId;
    }catch(e){
      console.warn('Не вдалося розпарсити снапшот рарностей:', e);
      rarityMap = {}; // fallback: усе Unknown
    }
  }

  // 3) Малюємо картку (звичайне зображення, без 3D та анімацій)
  function makeCard(id){
    const src = `../images/${id}.webp`;
    const rarity = rarityMap[id] || 'Unknown';
    const card = document.createElement('div');
    card.className = 'nft-card';
    card.dataset.id = id;
    card.innerHTML = `
      <div class="nft-thumb">
        <img src="${src}" alt="Owl #${id}" loading="lazy" decoding="async">
      </div>
      <div class="nft-meta">
        <div class="nft-number">Owl #${id}</div>
        <div class="rarity-badge ${rarityClass(rarity)}">${rarity}</div>
      </div>
    `;
    // клік — скачати зображення
    card.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = src;
      a.download = `${id}.webp`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
    return card;
  }

  // 4) Ініціалізація
  (async function initCollection(){
    await loadRaritiesFromSnapshot();
    const frag = document.createDocumentFragment();
    for (let i = 1; i <= TOTAL; i++) frag.appendChild(makeCard(i));
    grid.innerHTML = '';
    grid.appendChild(frag);
  })();
</script>
</body>
</html>
